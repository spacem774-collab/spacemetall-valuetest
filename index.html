<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Аттестация сотрудника — SpaceMETALL</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0a0a0c;
      --bg-card: #141418;
      --border: #2a2a32;
      --text: #e8e8ec;
      --text-muted: #8888a0;
      --accent-blue: #3b82f6;
      --accent-gold: #d4af37;
      --accent-silver: #c0c0c8;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Manrope', sans-serif;
      background: var(--bg-dark);
      color: var(--text);
      min-height: 100vh;
      background-image: radial-gradient(ellipse at 50% 0%, rgba(59, 130, 246, 0.06) 0%, transparent 50%);
    }
    .container { max-width: 900px; margin: 0 auto; padding: 2rem 1.5rem; }
    header { text-align: center; margin-bottom: 3rem; }
    .logo { height: 48px; width: auto; margin-bottom: 1.5rem; display: inline-block; }
    h1 { font-size: 1.75rem; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 0.5rem; }
    .subtitle { color: var(--text-muted); font-size: 1rem; }
    .choice-section { margin-bottom: 2.5rem; }
    .choice-section h2 {
      font-size: 1.125rem; font-weight: 600; color: var(--text-muted);
      text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 1.5rem; text-align: center;
    }
    .leagues {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.5rem;
      align-items: stretch;
    }
    .league-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    }
    .league-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
      border-color: rgba(255, 255, 255, 0.12);
    }
    .league-card:focus {
      outline: none;
      border-color: var(--accent-blue);
      box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.3);
    }
    .league-card.silver:hover {
      border-color: rgba(192, 192, 200, 0.4);
      box-shadow: 0 12px 40px rgba(59, 130, 246, 0.15);
    }
    .league-card.gold:hover {
      border-color: rgba(212, 175, 55, 0.4);
      box-shadow: 0 12px 40px rgba(212, 175, 55, 0.12);
    }
    .league-image-wrap {
      aspect-ratio: 1;
      padding: 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, rgba(255,255,255,0.03) 0%, transparent 100%);
    }
    .league-image-wrap img {
      width: 100%;
      max-width: 220px;
      height: auto;
      object-fit: contain;
    }
    .league-card-content {
      padding: 1.25rem 1.5rem;
      text-align: center;
      border-top: 1px solid var(--border);
    }
    .league-card-title { font-size: 1.25rem; font-weight: 700; margin-bottom: 0.25rem; }
    .league-card.silver .league-card-title { color: var(--accent-silver); }
    .league-card.gold .league-card-title { color: var(--accent-gold); }
    .league-card-desc { font-size: 0.9rem; color: var(--text-muted); }
    footer {
      text-align: center;
      margin-top: 3rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--border);
      font-size: 0.85rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <img src="assets/sm-logo.png" alt="SpaceMETALL" class="logo">
      <h1>Аттестация сотрудника</h1>
      <p class="subtitle">Выберите лигу для прохождения аттестации и перехода на следующий уровень</p>
    </header>

    <section class="choice-section">
      <h2>Выбор аттестации</h2>
      <div class="leagues">
        <a href="#silver" class="league-card silver" data-league="silver">
          <div class="league-image-wrap">
            <img src="assets/silver.png" alt="Silver лига">
          </div>
          <div class="league-card-content">
            <div class="league-card-title">Переход в Silver лигу</div>
            <p class="league-card-desc">Аттестация для перехода в Silver лигу</p>
          </div>
        </a>
        <a href="#gold" class="league-card gold" data-league="gold">
          <div class="league-image-wrap">
            <img src="assets/gold.png" alt="Gold лига">
          </div>
          <div class="league-card-content">
            <div class="league-card-title">Переход в Gold лигу</div>
            <p class="league-card-desc">Аттестация для перехода в Gold лигу</p>
          </div>
        </a>
      </div>
    </section>

    <footer>
      SpaceMETALL — внутренняя аттестация сотрудников
    </footer>
  </div>

  <script>
    document.querySelectorAll('.league-card').forEach(function(card) {
      card.addEventListener('click', function(e) {
        e.preventDefault();
        var league = card.getAttribute('data-league');
        window.location.href = 'attestation-' + league + '.html';
      });
    });
  </script>
</body>
</html>
